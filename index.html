<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スマホ動作テスト</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif}body{background:#ffd600;transition:background-color .08s;color:#111}.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:24px;text-align:center}.state{font-size:clamp(42px,14vw,88px);font-weight:900}.info{margin-top:18px;padding:14px 18px;border-radius:14px;background:#ffffffb8;font-weight:700;line-height:1.7}.small{font-size:14px;font-weight:600}button{margin-top:22px;font-size:20px;font-weight:800;padding:14px 26px;border:0;border-radius:999px;background:#111;color:white}button:disabled{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <div id="state" class="state">通常</div>
  <div class="info">
    上下加速度: <span id="ay">--</span><br>
    下カウント: <span id="down">0</span> / 上カウント: <span id="up">0</span><br>
    <span class="small">しゃがみ:10サンプル中6回 / 500ms待機 / 打ち上げ:5サンプル中3回</span>
  </div>
  <button id="start" type="button">センサー開始</button>
  <div id="msg" class="small" style="margin-top:14px"></div>
</div>
<script>
(() => {
  const stateEl=document.getElementById('state'), ayEl=document.getElementById('ay');
  const downEl=document.getElementById('down'), upEl=document.getElementById('up');
  const msg=document.getElementById('msg'), start=document.getElementById('start');
  let samples=[], set=0, lastSample=0, launchTimer=null;

  function show(name,color){stateEl.textContent=name;document.body.style.backgroundColor=color;}

  // スマホを縦向き（上端が上）で持っている時だけ判定する。
  // DeviceOrientation beta は、縦持ちをおおむね +90 度として扱う。
  let beta=null;
  let phase='normal';           // normal -> wait -> launch
  let motionSamples=[];
  let waitUntil=0;

  function orientation(e){
    if(typeof e.beta==='number') beta=e.beta;
  }

  function verticalOK(){
    return beta!==null && beta>50 && beta<130;
  }

  function resetNormal(){
    phase='normal';
    motionSamples=[];
    show('通常','#ffd600');
  }

  function judgeCrouch(){
    if(motionSamples.length<10)return;
    const down=motionSamples.filter(v=>v<-2.0).length;
    downEl.textContent=down;
    upEl.textContent='-';
    motionSamples=[];

    if(down>=6){
      phase='wait';
      waitUntil=performance.now()+500;
      show('しゃがむ','#1976d2');
      msg.textContent='しゃがむ検出：500ms待機中';
    }
  }

  function judgeLaunch(){
    if(motionSamples.length<5)return;
    const up=motionSamples.filter(v=>v>5.0).length;
    downEl.textContent='-';
    upEl.textContent=up;
    motionSamples=[];

    if(up>=3){
      phase='done';
      show('打ち上げ','#e53935');
      msg.textContent='打ち上げ！';
      clearTimeout(launchTimer);
      launchTimer=setTimeout(()=>{
        resetNormal();
        msg.textContent='スマホを縦向きに持って、しゃがむ→振り上げてください';
      },1000);
    }
  }

  function motion(e){
    const now=performance.now();
    if(now-lastSample<20)return; // 約50Hz
    lastSample=now;

    const y=e.acceleration && e.acceleration.y;
    if(typeof y!=='number')return;
    ayEl.textContent=y.toFixed(2)+' m/s²';

    // 姿勢条件で通常へ戻すのは、しゃがみ判定前だけ。
    // 一度しゃがみ成立したら、傾いても状態は保持する。
    if(phase==='normal' && !verticalOK()){
      motionSamples=[];
      show('通常','#ffd600');
      msg.textContent='スマホを縦向き（上端を上）にしてください  beta: '+(beta===null?'--':beta.toFixed(1))+'°';
      return;
    }

    if(phase==='wait'){
      // しゃがみ判定後の500msは加速度判定を完全に捨てる。
      motionSamples=[];
      const remain=Math.max(0,waitUntil-now);
      msg.textContent='しゃがむ検出：待機 '+Math.ceil(remain)+'ms';
      if(now>=waitUntil){
        phase='launch';
        msg.textContent='打ち上げ待機：上方向の加速度を監視中';
      }
      return;
    }

    if(phase==='done')return;

    // 打ち上げ監視中も縦向きを確認する。
    // 姿勢NGでもしゃがみ状態は解除せず、青のまま待つ。
    if(phase==='launch' && !verticalOK()){
      motionSamples=[];
      show('しゃがむ','#1976d2');
      msg.textContent='打ち上げ待機：スマホを縦向きにしてください  beta: '+(beta===null?'--':beta.toFixed(1))+'°';
      return;
    }

    motionSamples.push(y);
    if(phase==='normal') judgeCrouch();       // 10サンプル中6回
    else if(phase==='launch') judgeLaunch(); // 縦向き＋5サンプル中3回
  }

  async function begin(){
    try{
      if(typeof DeviceMotionEvent==='undefined') throw new Error('このブラウザはDeviceMotionに対応していません');
      if(typeof DeviceMotionEvent.requestPermission==='function'){
        const p=await DeviceMotionEvent.requestPermission();
        if(p!=='granted')throw new Error('モーションセンサーが許可されませんでした');
      }
      if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
        const o=await DeviceOrientationEvent.requestPermission();
        if(o!=='granted') throw new Error('姿勢センサーが許可されませんでした');
      }
      window.addEventListener('deviceorientation',orientation,{passive:true});
      window.addEventListener('devicemotion',motion,{passive:true});
      start.disabled=true; start.textContent='計測中';
      msg.textContent='スマホを縦向き（上端を上）に持って、しゃがむ→上へ振り上げてください';
    }catch(err){msg.textContent=err.message+'。HTTPSで開いているか確認してください。';}
  }
  start.addEventListener('click',begin);
})();
</script>
</body>
</html>
